<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <title>{{ page.title }} | {{ site.title }}</title>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description }}">

    <link rel="icon" media="(prefers-color-scheme:dark)" href="{{ site.favicon_dark }}" type="image/png" />
    <link rel="icon" media="(prefers-color-scheme:light)" href="{{ site.favicon }}" type="image/png" />

    {% if site.font == "Sans Serif" %}
    <link rel="stylesheet" href="{{ "/assets/css/font_sans_serif.css" | relative_url }}">
    {% else %}
    <link rel="stylesheet" href="{{ "/assets/css/font.css" | relative_url }}">
    {% endif %}
    {% if site.auto_dark_mode %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
    {% else %}
    <link rel="stylesheet" href="{{ "/assets/css/style-no-dark-mode.css" | relative_url }}">
    {% endif %}
    <style>
      .project-page {
        max-width: 980px;
        margin: 0 auto;
        padding: 2rem 1.25rem 3rem;
      }

      .project-page h1 {
        margin-bottom: 0.5rem;
      }

      .project-meta {
        color: #555555;
        font-size: 1.05rem;
        margin-bottom: 1.25rem;
      }

      .project-figure {
        margin: 1.5rem 0;
      }

      .project-figure img {
        border: 1px solid #d8d8d8;
        border-radius: 6px;
        display: block;
        width: 100%;
      }

      .project-figure figcaption {
        color: #555555;
        font-size: 0.95rem;
        line-height: 1.45;
        margin-top: 0.65rem;
      }
    </style>
  </head>
  <body>
    <main class="project-page">
      {{ content }}
    </main>
    <script data-goatcounter="https://dbcopper.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  </body>
</html>
